[project]
name = "nuvola-atlas-ingestion"
version = "0.1.0"
description = "Navuuna data ingestion microservice — normalises sub-county pillar readings and forwards them to the Laravel API."
requires-python = ">=3.13,<3.15"
readme = "README.md"
authors = [
    { name = "Devyan Jethwa", email = "devyan.jethwa@strathmore.edu" },
]
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.30",
    "python-dateutil>=2.9,<3",
    "sentry-sdk[fastapi]>=2.17,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.10",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.26",
    "types-python-dateutil>=2.9,<3",
]

# Without this, `pip install -e ".[dev]"` — the command CONTRIBUTING.md tells
# you to run — fails outright:
#
#   error: Multiple top-level packages discovered in a flat-layout: ['app', 'api']
#
# setuptools refuses to guess when a flat layout has more than one candidate.
# `api/` is not a package: it is the Vercel Fluid Compute entrypoint, a single
# shim re-exporting `app.main:app` so the deploy target and the local
# uvicorn/Docker target share one application factory. Only `app` ships.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
