name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so the freshest commit wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Which services did this PR actually touch?
  #
  # The previous guards tested `contains(toJson(pull_request.changed_files), ...)`
  # against a directory name. `changed_files` is an integer count, not a file
  # list, so `toJson` produced something like "7" and every contains() was
  # false — CI skipped on every pull request and only ever ran after a merge
  # to main. Resolving the paths properly is the whole point of the gate.
  #
  # The filter only runs on pull_request, where it resolves changed paths from
  # the API without needing a checkout. Push events skip it and run everything.
  # ----------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'docker-compose*.yml'
              # The pillar registry and its generator: every service consumes a
              # binding derived from these, so a change to either must re-run
              # all of them, not just whichever one happens to be edited too.
              - 'pillars.json'
              - 'scripts/gen-pillars.mjs'
            backend:
              - *shared
              - 'nuvola-atlas-backend/**'
            frontend:
              - *shared
              - 'nuvola-atlas-frontend/**'
            ingestion:
              - *shared
              - 'nuvola-atlas-ingestion/**'
            data:
              - *shared
              - 'nuvola-atlas-data/**'
              # The reconciled dataset lives at repo root, not inside the
              # service. tests/test_wasreb_end_to_end.py hashes it against
              # manifests/wasreb_impact_17_long_csv.yaml, so editing the CSV
              # without listing it here would skip the check that catches it.
              - 'wasreb_impact17_long.csv'

  # ----------------------------------------------------------------------------
  # Backend — Laravel 11 + PostgreSQL 16 + PostGIS 3.4
  # ----------------------------------------------------------------------------
  backend:
    name: Backend — phpunit + smoke checks
    runs-on: ubuntu-latest
    needs: changes

    # Pushes to main always run everything so branch protection stays meaningful.
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: nuvola_atlas_test
          POSTGRES_USER: nuvola
          POSTGRES_PASSWORD: nuvola_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U nuvola"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: nuvola-atlas-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Cache composer deps
        uses: actions/cache@v4
        with:
          path: nuvola-atlas-backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('nuvola-atlas-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Enable PostGIS in test DB
        run: |
          PGPASSWORD=nuvola_secret psql -h 127.0.0.1 -p 5434 -U nuvola -d nuvola_atlas_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      # Was scoped to `git diff origin/main...HEAD`. checkout@v4 fetches depth 1,
      # so on a pull request `origin/main` does not exist, git errored, the
      # trailing `|| true` swallowed it and the loop iterated over nothing — a
      # step named "lint" that linted zero files and reported success. Linting
      # the whole tracked set costs a few seconds and cannot silently no-op.
      - name: Lint PHP syntax (all tracked files)
        run: |
          fail=0
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null 2>&1 || { php -l "$f"; fail=1; }
          done
          exit $fail

      - name: Smoke — routes register
        run: php artisan route:list --path=api > /dev/null

      - name: Smoke — migrations replay cleanly
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5434
          DB_DATABASE: nuvola_atlas_test
          DB_USERNAME: nuvola
          DB_PASSWORD: nuvola_secret
        run: php artisan migrate:fresh --force --seed=false || php artisan migrate:fresh --force

      - name: Run phpunit suite
        run: php vendor/phpunit/phpunit/phpunit --no-coverage

      # Was `pint --dirty --test`. `--dirty` resolves its file list from
      # uncommitted working-tree changes, and a fresh checkout has none, so the
      # step inspected zero files and passed unconditionally — the same vacuous
      # pass the PHP lint step had. Scoping it to the whole repo is what makes
      # the check mean anything, and only then is it worth blocking on.
      - name: Pint
        run: vendor/bin/pint --test

      # Still informational: 158 pre-existing violations at level 5. Blocking
      # this now would only teach everyone to ignore a permanently red check.
      # The level stays at 5 — it does not get lowered to buy a green tick.
      - name: PHPStan (informational — 158 known violations at level 5)
        continue-on-error: true
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  # ----------------------------------------------------------------------------
  # Frontend — Vite + React + TypeScript (npm)
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend — tsc + vitest + build
    runs-on: ubuntu-latest
    needs: changes

    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: nuvola-atlas-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nuvola-atlas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # ----------------------------------------------------------------------------
  # Ingestion — FastAPI (Python 3.13)
  # ----------------------------------------------------------------------------
  ingestion:
    name: Ingestion — ruff + mypy + pytest
    runs-on: ubuntu-latest
    needs: changes

    if: github.event_name == 'push' || needs.changes.outputs.ingestion == 'true'

    defaults:
      run:
        working-directory: nuvola-atlas-ingestion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy strict
        run: mypy app

      - name: Pytest
        run: pytest --no-header -ra

  # ----------------------------------------------------------------------------
  # Data — offline pipeline: manifests -> sources -> nairobi_vitality.geojson
  # ----------------------------------------------------------------------------
  data:
    name: Data — ruff + pytest
    runs-on: ubuntu-latest
    needs: changes

    if: github.event_name == 'push' || needs.changes.outputs.data == 'true'

    defaults:
      run:
        working-directory: nuvola-atlas-data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # No mypy here: unlike nuvola-atlas-ingestion, this project does not
      # declare it as a dev dependency and is not typed strictly. Adding it
      # is a separate decision, not something to smuggle in with CI wiring.
      - name: Install project + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      # The geo extra (geopandas/shapely/pyogrio) is deliberately NOT installed.
      # pipeline/boundaries.py imports it lazily so the suite runs without it;
      # installing it here would add minutes to every run for no coverage.
      - name: Pytest
        run: pytest --no-header -ra

  # ----------------------------------------------------------------------------
  # Repo — the cross-cutting tripwires. These live in scripts/ and gate the
  # whole tree, so they belong to no single service. Until this job existed
  # they ran only in `make check` locally, which is how HISTORY.md sat in
  # violation of the freedom-index guard for three days without CI noticing.
  # ----------------------------------------------------------------------------
  repo:
    name: Repo — registries + freedom-index guard
    runs-on: ubuntu-latest

    steps:
      # Both scripts read the whole tree (check-freedom-index.sh drives
      # `git ls-files`), so they need full history, not a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pillar registry in sync
        run: node scripts/gen-pillars.mjs --check

      - name: Zone registry in sync
        run: node scripts/check-zones.mjs

      - name: Freedom-index purge holds
        run: bash scripts/check-freedom-index.sh
