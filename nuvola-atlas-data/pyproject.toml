[project]
name = "nuvola-atlas-data"
version = "0.1.0"
description = "Offline data pipeline for Navuuna: manifests -> sources -> nairobi_vitality.geojson."
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
