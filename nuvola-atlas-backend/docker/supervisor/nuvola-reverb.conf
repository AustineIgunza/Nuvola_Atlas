; ────────────────────────────────────────────────────────────────────────────
; Forge Daemon — Reverb websocket server.
;
; In Forge UI: Server > Daemons > New Daemon.
;   Command:   /usr/bin/php8.3 /home/forge/<site>/nuvola-atlas-backend/artisan reverb:start --host=127.0.0.1 --port=8080
;   User:      forge
;   Directory: /home/forge/<site>/nuvola-atlas-backend
;   Processes: 1          (single process — Reverb's own event loop fan-outs)
;   Stop signal: SIGTERM
;   Stop wait:  10
;
; Public TLS termination is handled by nginx (see docker/nginx/forge.conf
; Block C). Reverb itself only listens on loopback.
;
; When we scale to >1 backend node, set REVERB_SCALING_ENABLED=true + add
; REVERB_SCALING_CHANNEL=reverb-internal so the nodes share state via Redis
; pub/sub. Untested at our scale — load-test with Artillery first.
; ────────────────────────────────────────────────────────────────────────────

[program:nuvola-reverb]
process_name=%(program_name)s
command=/usr/bin/php8.3 /home/forge/<site>/nuvola-atlas-backend/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=forge
numprocs=1
redirect_stderr=true
stdout_logfile=/home/forge/<site>/nuvola-atlas-backend/storage/logs/reverb.log
stopwaitsecs=10
