; ────────────────────────────────────────────────────────────────────────────
; Forge Daemon — queue worker.
;
; In Forge UI: Server > Daemons > New Daemon.
;   Command:   /usr/bin/php8.3 /home/forge/<site>/nuvola-atlas-backend/artisan queue:work redis --sleep=3 --tries=3 --max-jobs=1000 --max-time=3600 --backoff=15 --timeout=120
;   User:      forge
;   Directory: /home/forge/<site>/nuvola-atlas-backend
;   Processes: 2          (bump to 4 once Mapbox tile prewarm + ingestion are live)
;   Stop signal: SIGTERM
;   Stop wait:  60
;
; This file mirrors what Forge will write into supervisor under the hood, kept
; in-repo for review and for the manual-VPS fallback.
; ────────────────────────────────────────────────────────────────────────────

[program:nuvola-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.3 /home/forge/<site>/nuvola-atlas-backend/artisan queue:work redis --sleep=3 --tries=3 --max-jobs=1000 --max-time=3600 --backoff=15 --timeout=120
autostart=true
autorestart=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/<site>/nuvola-atlas-backend/storage/logs/queue.log
stopwaitsecs=60
