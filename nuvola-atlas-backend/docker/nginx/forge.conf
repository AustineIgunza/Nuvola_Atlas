# ────────────────────────────────────────────────────────────────────────────
# Forge nginx config for the Nuvola Atlas backend.
#
# This is the *reference* config — Forge writes the real one into
# /etc/nginx/sites-available/<site>. After Forge generates the default, paste
# the marked blocks into the Forge UI under "Site > Edit Files > Nginx
# Configuration". Comments inline mark which blocks to copy.
#
# Forge handles:
#   - listen 443 + http2
#   - ssl_certificate / ssl_certificate_key (Let's Encrypt)
#   - server_name (the domain you typed when creating the site)
#   - the default fastcgi pass to php<ver>-fpm
#
# We override:
#   - root → nuvola-atlas-backend/public (we deploy from a monorepo)
#   - real-IP from Cloudflare
#   - websocket upgrade for Reverb
#   - security headers (CSP/HSTS already set by SecurityHeaders middleware in
#     PHP; the duplicates here are a belt-and-braces fallback)
# ────────────────────────────────────────────────────────────────────────────

# ── Block A — paste into "FORGE CONFIG (DOT NOT REMOVE!)" section
#    (sets the docroot to the monorepo subdir) ───────────────────────────────
#
# root /home/forge/<site>/nuvola-atlas-backend/public;
# index index.html index.htm index.php;
# charset utf-8;
# client_max_body_size 20M;

# ── Block B — paste anywhere inside the `server {}` block, before location /
#    (Cloudflare real-IP + gzip) ──────────────────────────────────────────────
#
# # Cloudflare IPv4 — refresh from https://www.cloudflare.com/ips-v4 quarterly
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# real_ip_header CF-Connecting-IP;
#
# gzip on;
# gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
# gzip_min_length 256;
# gzip_vary on;

# ── Block C — Reverb websocket upgrade (paste before `location /`) ──────────
# Reverb listens on 127.0.0.1:8080 as a Forge Daemon. nginx terminates TLS and
# proxies /app/* + /apps/* to it. The frontend should set
# REVERB_HOST=<api-host> and REVERB_PORT=443 with REVERB_SCHEME=https.
#
# location ~ ^/(app|apps)/ {
#     proxy_pass http://127.0.0.1:8080;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "upgrade";
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_read_timeout 60s;
#     proxy_send_timeout 60s;
# }

# ── Block D — static asset caching (paste anywhere inside the server) ───────
#
# location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
#     expires 30d;
#     add_header Cache-Control "public, immutable";
#     access_log off;
#     try_files $uri =404;
# }
#
# location = /favicon.ico { access_log off; log_not_found off; }
# location = /robots.txt  { access_log off; log_not_found off; }

# ── Block E — keep `location /` and `location ~ \.php$` as Forge generated
#    them. The Laravel SecurityHeaders middleware already injects HSTS/CSP on
#    HTML responses, so no add_header is needed here. ─────────────────────────

